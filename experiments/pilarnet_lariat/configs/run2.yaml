# Approximate forward response. Source/assumption distinctions are documented
# in ../README.md. These parameters are not a fitted detector model.
voxel_cm: 0.3
pilarnet_dx_cm_per_unit: 1.0
wire_pitch_cm: 0.4
wires: 240
ticks: 3072
sample_us: 0.128
drift_cm_us: 0.148 # Approx. 473 mm / (318.6 - 2.3) us, paper Fig. 34
field_kv_cm: 0.4865 # Run II detectorproperties_lariat.fcl
density_g_cm3: 1.38
main_drift_cm: 47.3
height_cm: 40.0
length_cm: 90.0
wire_origin_cm: -8.4195036381 # Stereo normal dotted with GDML wire-0 centre
trigger_tick: 189.0625 # 24.2 us before trigger, detectorclocks_lariat.fcl
induction_gap_us: 2.3
collection_gap_us: 4.3 # Approximate additional induction-to-collection drift
lifetime_us: 1600.0 # MC default; real data lifetime varies with run/day
transverse_diffusion_cm2_s: 13.0 # Prior, not a Run II measurement
longitudinal_diffusion_cm2_s: 4.8 # Prior, not a Run II measurement
shaping_peak_us: 3.0
adc_peak_per_electron: 0.00801088317 # 25 mV/fC, 0.5 mV/ADC
collection_response_scale: 0.50 # Run II signalservices_lariat.fcl
induction_response_scale: 0.66 # Run II signalservices_lariat.fcl
induction_lobe_delay_us: 2.0 # Toy field response; requires pulse validation
induction_negative_ratio: 0.85 # Old field-response parameter; toy kernel here
noise_rms_adc: 0.0 # Add only after matching real baseline noise
subvoxel_samples: 3 # Uniform integration within each coarse 3-mm voxel
collection_threshold_adc: 15.0
induction_threshold_adc: 7.0
